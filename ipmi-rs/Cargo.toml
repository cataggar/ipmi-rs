[package]
name = "ipmi-rs"
version = "0.6.0"
edition = "2021"
authors = [ "Johannes Cornelis Draaijer <jcdra1@gmail.com>" ]
license = "MIT OR Apache-2.0"
keywords = [ "ipmi", "sysadmin", "bmc" ]
categories = [ "parser-implementations", "network-programming" ]
description = "A pure rust implementation of the IPMI spec"
repository = "https://github.com/datdenkikniet/ipmi-rs"
documentation = "https://docs.rs/ipmi-rs/latest"

[dependencies]
log = "0.4"
nonmax = "0.5"
bitflags = "1.3"
md5 = { version = "0.8", optional = true }
ipmi-rs-core = { path = "../ipmi-rs-core", version = "0.6.0" }

# For unix-file IPMI
nix = { version = "0.30", default-features = false, features = [ "ioctl", "poll" ], optional = true }
serialport = { version = "4.7", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

# For RMCP+
hmac = "0.12.1"
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6"
rand = "0.8.5"
aes = "0.8.4"
cbc = "0.1.2"
getrandom = "0.4.2"
zeroize = "1.8"
symcrypt = { version = "=0.5.1", optional = true, features = ["sha1"] }

[features]
default = [ "unix-file", "md5" ]

# Connection features
unix-file = [ "nix" ]
serial = [ "dep:serialport" ]
ami-usb = [ "dep:libc" ]
symcrypt-backend = [ "dep:symcrypt" ]
kontron-fwum-update = [ "ipmi-rs-core/kontron-fwum-update" ]
md5 = [ "dep:md5" ]
hpm-update = [ "md5", "ipmi-rs-core/hpm-update" ]

[dev-dependencies]
pretty_env_logger = "0.5"
indicatif = "0.17"
clap = { version = "4.3", features = [ "derive" ]}
hex = "0.4.3"
ipmi-rs-log = { path = "../ipmi-rs-log", version = "0.2.0" }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"

[[example]]
name = "get-info"
required-features = ["unix-file"]

[[example]]
name = "sel"
required-features = ["unix-file"]

[[example]]
name = "common"
required-features = ["unix-file"]

[[example]]
name = "raw"
required-features = ["unix-file"]

[[example]]
name = "sensors-of-type"
required-features = ["unix-file"]

[[example]]
name = "ipmi-channels"
required-features = ["unix-file"]

[[example]]
name = "ipmi-lan-config"
required-features = ["unix-file"]

[[example]]
name = "chassis"
